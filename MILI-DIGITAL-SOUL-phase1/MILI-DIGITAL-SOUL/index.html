<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MILI-DIGITAL-SOUL 阶段一预览</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>MILI-DIGITAL-SOUL</h1>
      <p>阶段一预览：Canvas 基础动画，1920×1080，30 帧每秒，共 30 秒</p>
    </header>

    <div class="stage"><canvas id="stage" aria-label="MV 预览画面"></canvas></div>

    <section class="transport" aria-label="播放控制">
      <button id="play" type="button" aria-label="播放"></button>
      <div id="timeline" class="timeline" role="slider" tabindex="0" aria-label="时间轴"
           aria-valuemin="0" aria-valuemax="900" aria-valuenow="0" aria-valuetext="第 0 帧">
        <div id="segs" class="segs"></div>
        <div id="playhead" class="playhead"></div>
      </div>
      <output id="clock" class="clock">00:00.00 / 00:30.00</output>
    </section>

    <section class="meta">
      <span id="shotName">镜头 1/6 启动</span>
      <span id="frameNo">第 0 / 900 帧</span>
      <label><input type="checkbox" id="loop"> 循环播放</label>
      <label><input type="checkbox" id="hud" checked> 信息层</label>
      <span class="keys">空格 播放/暂停　← → 逐帧　Shift+← → 逐秒　Home / End 跳到首尾</span>
    </section>
  </main>

  <script src="src/util.js"></script>
  <script src="src/config.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/character.js"></script>
  <script src="src/shots.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/player.js"></script>
</body>
</html>
